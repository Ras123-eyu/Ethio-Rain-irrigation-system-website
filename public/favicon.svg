<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#0052FF" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Icon Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="64" height="64" rx="16" stroke="#00D4FF" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Irrigation Spray Radians -->
  <path d="M16 44 C 18 30, 30 18, 48 16" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 6" stroke-opacity="0.6" />
  <path d="M18 48 C 22 36, 36 22, 48 20" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 5" stroke-opacity="0.4" />

  <!-- Dynamic Water Drop -->
  <path d="M32 12 C32 12, 19 28, 19 37 C19 44.1797 24.8203 50 32 50 C39.1797 50 45 44.1797 45 37 C45 28 32 12 32 12 Z" 
        fill="url(#dropGrad)" 
        filter="url(#glow)" />

  <!-- Inner Sprout / Growth Leaf -->
  <path d="M32 47 C32 47 28 41 28 36 C28 33 30.5 30 32 28 C33.5 30 36 33 36 36 C36 41 32 47 32 47 Z" 
        fill="url(#leafGrad)" 
        opacity="0.95" />

  <!-- Center Water Core Sparkle -->
  <circle cx="28" cy="31" r="2.5" fill="#FFFFFF" opacity="0.85" />
</svg>
